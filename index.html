<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Halal 4 All Menu Screens</title>
<style>
  @font-face { font-family: "Zilla Slab"; font-weight: 700; src: url("fonts/zilla-slab-latin-700-normal.woff2") format("woff2"); }
  @font-face { font-family: "Barlow Semi Condensed"; font-weight: 500; src: url("fonts/barlow-semi-condensed-latin-500-normal.woff2") format("woff2"); }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { background: #29322d; color: #f6f1e4; font-family: "Barlow Semi Condensed", "Arial Narrow", Arial, sans-serif;
         display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5vh; padding: 5vw; }
  h1 { font-family: "Zilla Slab", Georgia, serif; font-size: 7vw; color: #f25c4a; line-height: 1; }
  p { font-size: 2.4vw; color: #b7c0b7; }
  nav { display: flex; gap: 4vw; flex-wrap: wrap; justify-content: center; }
  a { display: block; min-width: 32vw; padding: 4vh 4vw; background: #333e38; border: 0.4vw solid #4f5d55; color: inherit; text-decoration: none; }
  a:focus, a:hover { border-color: #7fd6a0; outline: none; }
  a b { display: block; font-family: "Zilla Slab", Georgia, serif; font-size: 5vw; line-height: 1.1; }
  a span { font-size: 2.2vw; color: #b7c0b7; }
</style>
</head>
<body>
<h1>Halal 4 All</h1>
<p>Pick the screen for this TV.</p>
<nav>
  <a href="1/" autofocus><b>Screen 1</b><span>Beef, veal, lamb, goat, steaks</span></a>
  <a href="2/"><b>Screen 2</b><span>Chicken, marinated, deli</span></a>
</nav>
</body>
</html>
